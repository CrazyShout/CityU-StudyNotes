name: Build PDFs
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and check all nine native TeX editions
        uses: xu-cheng/texlive-action@22c04326a5d855880f9d39bb955138bf11c6df80 # v3
        with:
          # Image verified by Build PDFs run 38823030296.
          docker_image: ghcr.io/xu-cheng/texlive-debian@sha256:78ac2204b8df113aca0561e8f173ad5b89ee51e90795173d2fe9bcf0fbce162e
          run: |
            apt-get update -y
            apt-get install -y python3 python3-venv libcairo2 fonts-dejavu-core fonts-noto-cjk
            python3 -m venv .venv
            .venv/bin/python -m pip install -r requirements-build.txt
            STUDY_NOTES_SOURCE_REF="$GITHUB_SHA" .venv/bin/python scripts/build.py
            .venv/bin/python scripts/validate.py
      - uses: actions/upload-artifact@v4
        with:
          name: A4-study-notes
          path: |
            pdf/
            latex/manifest.json
            latex/page-maps.json
            CS5489/exam-review/Midterm/*.pdf
            CS5489/exam-review/Midterm/*PageIndex.json
            CS5489/exam-review/Midterm/PaperIndex.md
          retention-days: 30
