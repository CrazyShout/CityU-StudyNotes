name: Build PDFs
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-build.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: python scripts/build.py
      - run: python scripts/validate.py
      - uses: actions/upload-artifact@v4
        with:
          name: A4-study-notes
          path: |
            pdf/
            CS5489/exam-review/Midterm/Questions.pdf
            CS5489/exam-review/Midterm/Answers.pdf
            CS5489/exam-review/Midterm/PageIndex.json
            CS5489/exam-review/Midterm/PaperIndex.md
          retention-days: 30
